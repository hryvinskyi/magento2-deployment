name: ci

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning deploy.sh install.sh scripts/test-deploy.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu exercises the flock lock path and cp -al hardlink clones,
        # macos the pidfile fallback, APFS clones and bash 3.2 (the floor)
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run deployment script tests
        run: bash scripts/test-deploy.sh

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install from this commit into a temporary directory
        env:
          DEPLOY_REF: ${{ github.sha }}
        run: |
          tmp="$(mktemp -d)"
          bash install.sh --dir "$tmp"
          "$tmp/deploy.sh" --help | head -3
          test -f "$tmp/.deploy.env.example"
          bash install.sh --dir "$tmp" | grep -q "already up to date"
